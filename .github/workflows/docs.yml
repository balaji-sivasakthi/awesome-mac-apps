name: Check documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and app ordering
        run: python3 scripts/check_docs.py
      - name: Check marketplace catalog matches the lists
        run: python3 marketplace/scripts/build-catalog.py --check
